name: Fallweise
options:
  bundleIdPrefix: com.arpithpm
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: AJKFVG2KV2
packages:
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift.git
    from: 2.8.0
targets:
  Fallweise:
    type: application
    platform: iOS
    sources:
      - path: Fallweise
    resources:
      - path: Fallweise/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arpithpm.fallweise
        PRODUCT_NAME: Fallweise
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Fallweise/Info.plist
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: LiveKit
        product: LiveKit
      - target: FallweiseWatch
  FallweiseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FallweiseWatch
      - path: Fallweise/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arpithpm.fallweise.watchkitapp
        PRODUCT_NAME: Fallweise Watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Fallweise
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.arpithpm.fallweise
        CODE_SIGN_STYLE: Automatic
schemes:
  Fallweise:
    build:
      targets:
        Fallweise: all
    run:
      config: Debug
  FallweiseWatch:
    build:
      targets:
        FallweiseWatch: all
    run:
      config: Debug
