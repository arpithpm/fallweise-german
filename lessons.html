<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');

r:var(--green)}.section h2{font:700 clamp(35px,5vw,54px)/1 'Fraunces';letter-spacing:-.035em;margin:10px 0 18px}.section-intro{color:var(--muted);line-height:1.65;max-width:740px}.rule{margin:28px 0;background:var(--green);color:white;padding:28px;display:grid;grid-template-columns:.65fr 1.35fr;gap:25px;align-items:center}.rule-label{font-size:11px;letter-spacing:.12em;color:var(--lime);font-weight:700}.formula{font:600 clamp(23px,4vw,38px)/1.3 'Fraunces'}.formula mark{background:var(--lime);color:var(--ink);padding:2px 6px}.examples{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.example{background:var(--paper);border:1px solid var(--line);padding:22px;min-height:145px}.de{font:600 23px/1.4 'Fraunces'}.en{font-size:13px;color:var(--muted);margin-top:10px}.note{margin-top:20px;border-left:6px solid var(--coral);background:#f6e0d9;padding:18px 20px;font-size:14px;line-height:1.55}.note b{display:block;margin-bottom:4px}.practice{background:var(--green);color:white;padding:70px max(30px,8vw)}.practice-inner{max-width:850px}.practice h2{font:700 clamp(40px,5vw,62px) 'Fraunces';margin:10px 0 30px}.quiz-card{background:var(--paper);color:var(--ink);padding:30px;box-shadow:10px 10px 0 var(--lime)}.qcount{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}.question{font:600 28px/1.4 'Fraunces';margin:13px 0 22px}.answers{display:grid;gap:9px}.answer{padding:13px 15px;text-align:left;border:1px solid var(--line);background:white;cursor:pointer}.answer:hover{border-color:var(--ink)}.answer.correct{background:#dcefb5;border-color:var(--green)}.answer.wrong{background:#f7c5ba;border-color:#a74532}.feedback{min-height:29px;margin-top:15px;font-size:13px;font-weight:700;color:var(--green)}.next{display:none;background:var(--ink);color:white;border:0;padding:11px 15px;cursor:pointer}.complete{display:none;background:var(--lime);color:var(--ink);padding:20px;margin-top:22px;font-weight:700}.footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}@media(max-width:800px){.layout{grid-template-columns:1fr}.sidebar{display:none}.hero{padding:55px 20px}.lesson-body{padding:55px 18px}.rule{grid-template-columns:1fr}.examples{grid-template-columns:1fr}.back{font-size:0}.back:after{content:'←';font-size:18px}.practice{padding:55px 18px}}</style></head>
<body><nav><a class="back" href="index.html">← Learning path</a><a class="logo" href="index.html">fall<i>weise</i>.</a><span class="level-pill" id="levelPill">A1</span></nav><div class="layout"><aside class="sidebar" id="sidebar"></aside><main class="content"><header class="hero"><div class="kicker" id="kicker"></div><h1 id="title"></h1><p class="goal" id="goal"></p><div class="meta"><span id="duration"></span><span>Visual explanation</span><span>Instant practice</span></div></header><div class="lesson-body" id="lessonBody"></div><section class="practice"><div class="practice-inner"><div class="kicker" style="color:var(--lime)">Check your understanding</div><h2>Make the pattern stick.</h2><div class="quiz-card"><div class="qcount" id="qcount"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next →</button></div><div class="complete" id="complete">Chapter complete ✓ Choose your next lesson from the learning path.</div></div></section><footer class="footer">Short lesson. Useful pattern. Real German.</footer></main></div>
<script>
const lessons={
'word-order':{level:'A1',num:'05',title:'Ask clearly. Put the verb in its place.',goal:'Ask questions and build German sentences without guessing where the verb belongs.',duration:'12 min',sections:[
['The verb owns position two','In a normal statement, the conjugated verb takes the second idea-position—not necessarily the second word.','IDEA 1 + VERB + REST',['Ich <mark>lerne</mark> heute Deutsch.','Heute <mark>lerne</mark> ich Deutsch.'],['I learn German today.','Today I learn German.'],'Move another idea to the front? The subject moves behind the verb. The verb stays in position two.'],
['Yes/no questions put the verb first','When the answer can be ja or nein, lead with the conjugated verb.','VERB + SUBJECT + REST?',['<mark>Kommst</mark> du aus Berlin?','<mark>Hast</mark> du Zeit?'],['Are you from Berlin?','Do you have time?'],'Statement: Du kommst aus Berlin. Question: Kommst du aus Berlin?'],
['W-questions begin with the missing information','Use wer, was, wann, wo, warum, wie, or wohin; the verb follows immediately.','W-WORD + VERB + SUBJECT?',['Wo <mark>wohnst</mark> du?','Warum <mark>lernst</mark> du Deutsch?'],['Where do you live?','Why are you learning German?'],'Think of a question as two fixed slots: question word, then verb.']],quiz:[['Choose the natural sentence.',['Heute ich lerne Deutsch.','Heute lerne ich Deutsch.','Heute Deutsch ich lerne.'],1,'The verb lerne stays in position two.'],['Turn this into a yes/no question: Du hast Zeit.',['Hast du Zeit?','Du Zeit hast?','Zeit du hast?'],0,'A yes/no question begins with the conjugated verb.'],['Complete: Wo ___ du?',['du wohnst','wohnst','wohnen'],1,'A W-question uses W-word + verb + subject.']]},
'modals':{level:'A1',num:'06',title:'Say what you can, want, and must do.',goal:'Use modal and separable verbs to talk about plans, abilities, needs, and routines.',duration:'14 min',sections:[
['Modal verbs create a frame','Conjugate the modal in position two. Send the action verb—in its infinitive form—to the end.','SUBJECT + MODAL + … + INFINITIVE',['Ich <mark>kann</mark> gut schwimmen.','Wir <mark>müssen</mark> heute arbeiten.'],['I can swim well.','We must work today.'],'The modal opens the sentence frame; the action closes it.'],
['The six everyday modals','Learn them by intention: ability, necessity, desire, permission, obligation, and preference.','können · müssen · wollen · dürfen · sollen · mögen',['Du <mark>darfst</mark> hier parken.','Sie <mark>will</mark> nach Hause gehen.'],['You may park here.','She wants to go home.'],'möchten is the polite everyday form for requests: Ich möchte einen Kaffee.'],
['Separable verbs split in the present','The prefix travels to the end in a normal main clause.','SUBJECT + VERB STEM + … + PREFIX',['Ich <mark>stehe</mark> um sieben <mark>auf</mark>.','Er <mark>ruft</mark> seine Mutter <mark>an</mark>.'],['I get up at seven.','He calls his mother.'],'Dictionary: aufstehen. Sentence: Ich stehe auf. The two pieces still frame the idea.']],quiz:[['Ich ___ heute arbeiten.',['muss','müssen','arbeite muss'],0,'The modal is conjugated: ich muss.'],['Choose the correct sentence.',['Ich kann schwimme.','Ich kann schwimmen.','Ich schwimmen kann.'],1,'After a modal, the infinitive goes to the end.'],['Er ___ um 7 Uhr ___.',['aufsteht','steht / auf','steht / an'],1,'aufstehen separates: er steht … auf.']]},
'prepositions':{level:'A2',num:'04',title:'Know whether you are somewhere—or going there.',goal:'Use dative prepositions and solve two-way prepositions with one physical question: location or destination?',duration:'16 min',sections:[
['Seven prepositions always choose dative','Treat this set as a rhythm you can memorize.','aus · bei · mit · nach · seit · von · zu + DATIV',['Ich fahre <mark>mit dem</mark> Bus.','Sie kommt <mark>aus der</mark> Schweiz.'],['I travel by bus.','She comes from Switzerland.'],'Sing it: aus-bei-mit, nach-seit, von-zu. Every noun after them wears dative.'],
['Two-way prepositions describe space','an, auf, hinter, in, neben, über, unter, vor, zwischen can use dative or accusative. Meaning decides.','WO? → DATIV · WOHIN? → AKKUSATIV',['Das Buch liegt <mark>auf dem</mark> Tisch.','Ich lege es <mark>auf den</mark> Tisch.'],['The book is lying on the table.','I put it onto the table.'],'No change of location: dative. Destination or boundary-crossing: accusative.'],
['Movement alone is not the test','Walking around inside a park is still a location. Entering the park has a destination.','LOCATION ≠ STATIC · DESTINATION ≠ ANY MOVEMENT',['Ich laufe <mark>im</mark> Park.','Ich laufe <mark>in den</mark> Park.'],['I run in the park.','I run into the park.'],'Ask where the activity occurs versus where the subject ends up.']],quiz:[['Wir fahren mit ___ Zug.',['der','den','dem'],2,'mit always takes dative: dem Zug.'],['Das Bild hängt an ___ Wand.',['die','der','den'],1,'It is already there: wo? Dative feminine = der.'],['Ich hänge das Bild an ___ Wand.',['die','der','dem'],0,'The wall is the destination: wohin? Accusative feminine = die.']]},
'connectors':{level:'A2',num:'05',title:'Connect thoughts without losing the verb.',goal:'Explain reasons, report ideas, and describe conditions using weil, dass, and wenn.',duration:'14 min',sections:[
['Subordinate clauses send the verb home','After weil, dass, or wenn, the conjugated verb moves to the end of that clause.','CONNECTOR + SUBJECT + … + VERB',['Ich bleibe zu Hause, weil ich krank <mark>bin</mark>.','Ich weiß, dass er heute <mark>kommt</mark>.'],['I stay home because I am ill.','I know that he is coming today.'],'The comma is your warning sign: a new clause begins and its verb waits at the end.'],
['Each connector has a job','weil gives a reason, dass introduces a reported idea, and wenn gives a condition or repeated time.','WEIL = BECAUSE · DASS = THAT · WENN = IF/WHEN',['Sie lernt, <mark>weil</mark> sie die Prüfung hat.','Ich glaube, <mark>dass</mark> es stimmt.'],['She studies because she has the exam.','I believe that it is true.'],'Use als—not wenn—for one single event in the past.'],
['A subordinate clause can come first','The entire subordinate clause fills position one. The main-clause verb then comes immediately.','WENN-CLAUSE, VERB + SUBJECT …',['<mark>Wenn ich Zeit habe</mark>, komme ich mit.','<mark>Weil es regnet</mark>, bleiben wir hier.'],['If I have time, I will come along.','Because it is raining, we stay here.'],'Notice komme ich—not ich komme—after a fronted subordinate clause.']],quiz:[['Ich bleibe hier, weil ich müde ___.',['bin','ich bin','sein'],0,'In the weil-clause, the conjugated verb goes last.'],['Which connector means “that”?',['weil','dass','wenn'],1,'dass introduces a reported idea or statement.'],['Wenn ich Zeit habe, ___ ich mit.',['ich komme','komme','kommen'],1,'The first clause occupies position one, so the main verb comes next.']]},
'describe':{level:'A2',num:'06',title:'Compare, describe, and talk about yourself.',goal:'Make richer descriptions with comparison, reflexive actions, and dependable adjective-ending patterns.',duration:'18 min',sections:[
['Comparisons grow with -er and am … -sten','Use als after a comparative and am for a standalone superlative.','schnell → schneller → am schnellsten',['Berlin ist <mark>größer als</mark> Bonn.','Dieser Zug fährt <mark>am schnellsten</mark>.'],['Berlin is bigger than Bonn.','This train travels fastest.'],'Key irregulars: gut → besser → am besten; viel → mehr → am meisten.'],
['Reflexive means the action returns to the subject','The pronoun points back to the person doing the action. Most forms use mich/dich/sich/uns/euch/sich.','ICH → MICH · DU → DICH · ER/SIE → SICH',['Ich <mark>freue mich</mark> auf die Reise.','Du <mark>erinnerst dich</mark> an ihn.'],['I look forward to the trip.','You remember him.'],'Learn the whole package, including its preposition: sich freuen auf + accusative.'],
['Adjective endings carry missing information','After der/die/das, the article already signals gender, so the adjective is usually -e or -en. After ein, the adjective often supplies the missing signal.','DER: -e/-en · EIN: fehlendes Signal',['der <mark>kleine</mark> Hund','ein <mark>kleiner</mark> Hund'],['the small dog','a small dog'],'Practical shortcut: after definite articles, use -e in the five basic nominative/accusative slots; use -en almost everywhere else.']],quiz:[['Mein Auto ist ___ als deins.',['schnell','schneller','am schnellsten'],1,'Comparative adjectives normally add -er.'],['Ich freue ___ auf den Urlaub.',['mir','mich','dich'],1,'The subject ich refers back to itself with mich.'],['Choose the correct phrase.',['der kleine Hund','der kleiner Hund','der kleinen Hund'],0,'Masculine nominative after der uses adjective ending -e.']]},
'rich-clauses':{level:'B1',num:'04',title:'Link richer ideas into elegant sentences.',goal:'Identify people and things precisely, use zu-infinitives, and express relationships with genitive.',duration:'18 min',sections:[
['Relative clauses attach information to a noun','The relative pronoun matches the noun’s gender and takes the case required inside its own clause. The verb goes last.','NOUN, RELATIVE PRONOUN + … + VERB',['Das ist der Mann, <mark>der</mark> hier arbeitet.','Das ist der Mann, <mark>den</mark> ich kenne.'],['That is the man who works here.','That is the man whom I know.'],'Same man, different job inside the relative clause: der is subject; den is direct object.'],
['zu + infinitive compresses an idea','When both parts share a logical subject, an infinitive clause is often cleaner than a dass-clause.','…, ZU + INFINITIVE',['Ich versuche, mehr <mark>zu schlafen</mark>.','Es ist wichtig, pünktlich <mark>zu sein</mark>.'],['I try to sleep more.','It is important to be punctual.'],'With separable verbs, zu goes inside: anzufangen, einzukaufen.'],
['Genitive answers “whose?”','Formal and written German uses genitive for possession and after certain prepositions.','DES + -(E)S · DER',['Das Auto <mark>des Mannes</mark> ist neu.','Trotz <mark>des Regens</mark> gehen wir.'],["The man's car is new.",'Despite the rain, we are going.'],'Masculine and neuter nouns usually gain -s or -es in genitive.']],quiz:[['Das ist die Frau, ___ in Berlin wohnt.',['die','der','den'],0,'The woman is the subject of wohnt, so feminine nominative die.'],['Ich habe vor, Deutsch ___.',['zu lernen','lernen zu','gelernt'],0,'The infinitive clause ends in zu lernen.'],['Das ist das Haus ___ Familie.',['die','der','des'],1,'Feminine genitive uses der Familie.']]},
'perspective':{level:'B1',num:'05',title:'Shift perspective and imagine possibilities.',goal:'Use passive voice to focus on an action and Konjunktiv II for wishes, hypotheticals, and polite requests.',duration:'18 min',sections:[
['Passive focuses on what happens','Use werden + past participle when the action matters more than the actor.','WERDEN + PARTIZIP II',['Das Haus <mark>wird gebaut</mark>.','Die E-Mail <mark>wurde geschickt</mark>.'],['The house is being built.','The email was sent.'],'State versus process: Die Tür ist geschlossen describes a state; Die Tür wird geschlossen describes the action.'],
['würde + infinitive imagines a different reality','This flexible Konjunktiv II pattern handles most hypothetical actions.','WÜRDE + … + INFINITIVE',['Ich <mark>würde</mark> gern länger <mark>bleiben</mark>.','Was <mark>würdest</mark> du <mark>tun</mark>?'],['I would like to stay longer.','What would you do?'],'Common verbs prefer their own forms: wäre, hätte, könnte, müsste, sollte.'],
['Politeness creates distance','Konjunktiv II softens requests and advice. It sounds respectful rather than uncertain.','KÖNNTEN / WÜRDEN / HÄTTEN SIE …?',['<mark>Könnten</mark> Sie mir helfen?','Ich <mark>hätte</mark> gern einen Kaffee.'],['Could you help me?','I would like a coffee.'],'For polite service situations, hätte gern is one of the most useful phrases in German.']],quiz:[['Die Straße ___ repariert.',['wird','hat','würde'],0,'Process passive uses werden + past participle.'],['If I had time, I ___ travel.',['werde','würde','wurde'],1,'A hypothetical action uses würde + infinitive.'],['Choose the polite request.',['Hilf mir!','Könnten Sie mir helfen?','Du hilfst mir.'],1,'Könnten Sie …? makes the request polite.']]},
'arguments':{level:'B1',num:'06',title:'Write clearly and make your case.',goal:'Structure opinions, connect arguments, and write a professional German email with confidence.',duration:'16 min',sections:[
['Give your reader a visible structure','State your view, support it, acknowledge another side, and finish with a conclusion.','POSITION → REASON → CONTRAST → CONCLUSION',['<mark>Meiner Meinung nach</mark> ist das sinnvoll.','<mark>Zusammenfassend</mark> überwiegen die Vorteile.'],['In my opinion, that is sensible.','In summary, the advantages outweigh the disadvantages.'],'One clear idea per sentence sounds stronger than translating long English sentences.'],
['Connectors signal the relationship','Coordinating connectors keep normal word order; adverbial connectors occupy position one and trigger inversion.','ABER + SUBJECT · DESHALB + VERB',['Es ist teuer, <mark>aber</mark> es ist nützlich.','Es ist teuer. <mark>Deshalb kaufe</mark> ich es nicht.'],['It is expensive, but useful.','It is expensive. Therefore I do not buy it.'],'Useful map: außerdem adds, jedoch contrasts, deshalb gives a result, obwohl concedes.'],
['Formal email language is a reusable frame','Use a clear subject, formal greeting, concise request, thanks, and formal closing.','ANREDE → ANLIEGEN → BITTE → GRUSS',['<mark>Sehr geehrte Frau Weber,</mark>','<mark>Mit freundlichen Grüßen</mark>'],['Dear Ms Weber,','Kind regards,'],'Sie, Ihnen, and Ihr are capitalized in formal correspondence. Avoid Hallo when the relationship is formal.']],quiz:[['Which phrase introduces an opinion?',['Meiner Meinung nach','Mit freundlichen Grüßen','Trotzdem'],0,'Meiner Meinung nach means “in my opinion.”'],['Es regnet. Deshalb ___ wir zu Hause.',['wir bleiben','bleiben','blieben wir'],1,'Deshalb occupies position one, so the verb follows.'],['Choose the formal closing.',['Bis bald','Liebe Grüße','Mit freundlichen Grüßen'],2,'Mit freundlichen Grüßen is the standard formal closing.']]}}
const order=[['A1',['word-order','modals']],['A2',['prepositions','connectors','describe']],['B1',['rich-clauses','perspective','arguments']]];let id=new URLSearchParams(location.search).get('id');if(!lessons[id])id='word-order';const L=lessons[id];document.title=L.title+' — Fallweise';levelPill.textContent=L.level;kicker.textContent=`${L.level} · CHAPTER ${L.num}`;title.textContent=L.title;goal.textContent=L.goal;duration.textContent=L.duration;
order.forEach(([level,ids])=>{sidebar.insertAdjacentHTML('beforeend',`<div class="side-label">${level}</div>`);ids.forEach(x=>{let a=document.createElement('a');a.className='side-link'+(x===id?' active':'');a.href=`lessons.html?id=${x}`;a.textContent=lessons[x].title;sidebar.appendChild(a)})});
L.sections.forEach((s,i)=>{let examples=s[3].map((de,j)=>`<div class="example"><div class="de">${de}</div><div class="en">${s[4][j]}</div></div>`).join('');lessonBody.insertAdjacentHTML('beforeend',`<section class="section"><div class="section-num">${String(i+1).padStart(2,'0')} · NOTICE THE PATTERN</div><h2>${s[0]}</h2><p class="section-intro">${s[1]}</p><div class="rule"><div class="rule-label">THE RECIPE</div><div class="formula">${s[2]}</div></div><div class="examples">${examples}</div><div class="note"><b>Memory cue</b>${s[5]}</div></section>`)});
let qi=0,score=0,locked=false;function render(){locked=false;let q=L.quiz[qi];qcount.textContent=`QUESTION ${qi+1} OF ${L.quiz.length}`;question.textContent=q[0];answers.innerHTML='';feedback.textContent='';next.style.display='none';q[1].forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>choose(i,b);answers.appendChild(b)})}function choose(i,b){if(locked)return;locked=true;let q=L.quiz[qi];answers.children[q[2]].classList.add('correct');if(i===q[2]){score++;feedback.textContent='Richtig! '+q[3]}else{b.classList.add('wrong');feedback.textContent='Not quite. '+q[3]}next.style.display='inline-block';next.textContent=qi===L.quiz.length-1?'Finish chapter ✓':'Next question →'}next.onclick=()=>{if(qi===L.quiz.length-1){complete.style.display='block';next.style.display='none';complete.textContent=`Chapter complete · ${score}/${L.quiz.length} correct ✓`;return}qi++;render()};render();
</script><script src="immersive.js"></script><script src="speech.js?v=20260802-2"></script><script src="adaptive-sentences.js?v=20260802-1"></script><script src="persistence.js?v=20260802-5"></script></body></html>
