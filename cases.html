<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg"><title>Cases — Fallweise</title><link rel="stylesheet" href="adaptive-cases.css?v=20260802-1">
<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');:root{--ink:#18201d;--cream:#f4f0e5;--paper:#fffdf6;--green:#254f3d;--lime:#d9ed72;--coral:#f1886f;--blue:#8dc8d8;--muted:#66706b;--line:#d8d4c8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit}button{font:inherit}nav{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{font:700 23px 'Fraunces';text-decoration:none}.logo i{color:var(--green)}.back{text-decoration:none;font-size:13px}.pill{background:var(--ink);color:white;padding:8px 13px;border-radius:99px;font-size:11px}.hero{max-width:1180px;margin:auto;padding:78px 24px 70px;display:grid;grid-template-columns:1.15fr .85fr;gap:65px;align-items:end}.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--green)}h1{font:700 clamp(55px,8vw,96px)/.89 'Fraunces';letter-spacing:-.055em;margin:15px 0 25px}.goal{font-size:19px;line-height:1.6;color:var(--muted)}.hero-card{background:var(--paper);border:1px solid var(--ink);padding:27px;box-shadow:9px 9px 0 var(--accent,var(--lime))}.hero-card small{font-size:10px;letter-spacing:.13em;color:var(--muted)}.hero-sentence{font:600 29px/1.45 'Fraunces';margin:18px 0}.hero-sentence mark{background:var(--accent,var(--lime));padding:2px 5px}.legend{font-size:12px;color:var(--muted)}.content{background:var(--green);color:white;padding:80px 24px}.inner{max-width:1000px;margin:auto}.section{margin-bottom:75px}.section h2{font:700 clamp(38px,6vw,60px)/1 'Fraunces';margin:10px 0 18px;letter-spacing:-.04em}.intro{max-width:750px;line-height:1.65;opacity:.78}.rule{background:var(--paper);color:var(--ink);margin:28px 0;padding:27px;display:grid;grid-template-columns:.7fr 1.3fr;gap:25px}.rule b{font-size:11px;letter-spacing:.12em;color:var(--green)}.formula{font:600 30px/1.35 'Fraunces'}.examples{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.example{background:var(--paper);color:var(--ink);padding:22px;min-height:145px}.de{font:600 22px/1.4 'Fraunces'}.de mark{background:var(--accent,var(--lime));padding:2px 4px}.en{font-size:12px;color:var(--muted);margin-top:9px}.why{font-size:12px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);color:var(--green);font-weight:700}.table{display:grid;border-top:1px solid white;border-left:1px solid white;margin-top:25px}.cell{border-right:1px solid white;border-bottom:1px solid white;padding:15px}.cell.head{background:var(--ink);font-weight:700}.memory{background:var(--accent,var(--lime));color:var(--ink);padding:19px;margin-top:20px;font-weight:700}.practice{padding:75px 24px}.practice-inner{max-width:800px;margin:auto}.practice h2{font:700 52px 'Fraunces';margin:10px 0 30px}.quiz{background:var(--paper);padding:30px;border:1px solid var(--ink);box-shadow:10px 10px 0 var(--accent,var(--lime))}.qcount{font-size:10px;letter-spacing:.12em;color:var(--muted)}.question{font:600 28px/1.4 'Fraunces';margin:13px 0 22px}.answers{display:grid;gap:9px}.answer{padding:13px;text-align:left;background:white;border:1px solid var(--line);cursor:pointer}.answer.correct{background:#dcefb5}.answer.wrong{background:#f6c2b7}.feedback{min-height:30px;margin-top:13px;color:var(--green);font-weight:700;font-size:13px}.next{display:none;background:var(--ink);color:white;border:0;padding:11px 15px;cursor:pointer}.footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}@media(max-width:760px){.hero{grid-template-columns:1fr}.rule{grid-template-columns:1fr}.examples{grid-template-columns:1fr}.back{font-size:0}.back:after{content:'←';font-size:18px}.content,.practice{padding:55px 18px}}</style></head>
<body><nav><a class="back" href="index.html">← Learning path</a><a class="logo" href="index.html">fall<i>weise</i>.</a><span class="pill" id="pill"></span></nav><header class="hero"><div><div class="kicker" id="kicker"></div><h1 id="title"></h1><p class="goal" id="goal"></p></div><div class="hero-card"><small>SENTENCE SNAPSHOT</small><div class="hero-sentence" id="snapshot"></div><div class="legend" id="legend"></div></div></header><main><section class="content"><div class="inner" id="content"></div></section><section class="practice"><div class="practice-inner"><div class="kicker">Your turn</div><h2 id="practiceTitle">Choose the right job.</h2><div class="mastery" id="mastery"></div><div class="quiz" id="quiz"><div class="qcount" id="qcount"></div><div id="exerciseKind"></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback"></div><button class="next" id="next">Next →</button><div class="result-panel" id="resultPanel"></div></div></div></section></main><footer class="footer">Different level. Different case job. No duplication.</footer>
<script>
const tracks={
a1:{level:'A1 · CHAPTER 02',accent:'#f1886f',title:'Who does what to whom?',goal:'Learn only the two cases you need first: nominative for the doer and accusative for the directly affected person or thing.',snapshot:'<mark>Der Hund</mark> sieht <mark>den Mann</mark>.',legend:'Der Hund = doer · den Mann = direct object',sections:[
['Start with the verb, then find the doer','Every complete sentence has a subject. Ask: who or what performs the verb? That noun is nominative.','WER ODER WAS? → NOMINATIV',[['<mark>Die Frau</mark> kauft Brot.','The woman buys bread.','Who buys? Die Frau.'],['Heute arbeitet <mark>der Mann</mark>.','The man works today.','Who works? Der Mann.'],['<mark>Das Kind</mark> lacht.','The child laughs.','Who laughs? Das Kind.'],['<mark>Die Freunde</mark> kommen.','The friends are coming.','Who comes? Die Freunde.']]],
['Now find what the action hits','The direct object receives the action directly. Ask wen? for a person or was? for a thing.','WEN ODER WAS? → AKKUSATIV',[['Ich sehe <mark>den Hund</mark>.','I see the dog.','What do I see? Den Hund.'],['Sie kauft <mark>eine Tasche</mark>.','She buys a bag.','What does she buy? Eine Tasche.'],['Wir besuchen <mark>das Museum</mark>.','We visit the museum.','What do we visit? Das Museum.'],['Er liebt <mark>seine Familie</mark>.','He loves his family.','Whom does he love? Seine Familie.']]],
['Only masculine articles visibly change','At this level, the key transformation is der → den and ein → einen. Feminine, neuter, and plural definite articles look unchanged.','DER → DEN · EIN → EINEN',[['<mark>Der</mark> Hund sieht <mark>den</mark> Mann.','The dog sees the man.','Both nouns are masculine; their jobs reveal the article.'],['<mark>Ein</mark> Mann hat <mark>einen</mark> Hund.','A man has a dog.','The subject uses ein; the direct object uses einen.']]],
['Pronouns do the same jobs','Personal pronouns also change when they become direct objects. Learn the high-frequency pairs as small chunks.','ICH → MICH · DU → DICH · ER → IHN',[['<mark>Ich</mark> sehe <mark>dich</mark>.','I see you.','Ich is the doer; dich is the direct object.'],['<mark>Sie</mark> kennt <mark>ihn</mark>.','She knows him.','Sie is nominative; ihn replaces a masculine object.'],['<mark>Wir</mark> hören <mark>euch</mark>.','We hear you all.','Wir acts; euch receives the action.'],['<mark>Er</mark> besucht <mark>uns</mark>.','He visits us.','Er is the subject; uns is accusative.']]]],memory:'A1 shortcut: the doer wears nominative. The action target wears accusative. Watch masculine der become den.',quiz:[['In “Der Junge isst den Apfel,” what is nominative?',['der Junge','den Apfel','isst'],0,'Der Junge performs the action.'],['Choose: Ich sehe ___ Mann.',['der','den','dem'],1,'sehen takes a direct object; masculine accusative is den.'],['Which sentence is correct?',['Ein Hund jagt einen Ball.','Einen Hund jagt ein Ball.','Ein Hund jagt einem Ball.'],0,'The dog is the doer; the ball is the direct object.'],['Complete: Sie kennt ___.',['er','ihn','ihm'],1,'The known person is the direct object: ihn.'],['In “Heute besucht uns die Lehrerin,” who is the doer?',['Heute','uns','die Lehrerin'],2,'Position does not decide case; die Lehrerin performs besucht.']]},
a2:{level:'A2 · CHAPTER 01',accent:'#8dc8d8',title:'Give, help, and belong.',goal:'Add the receiver: learn dative articles, dative pronouns, and verbs that choose dative—even when nothing is being given.',snapshot:'Der Mann gibt <mark>der Frau</mark> den Kaffee.',legend:'der Frau = receiver · the dative job',sections:[
['Dative identifies the receiver','In a giving sentence, the doer transfers a thing to a person. Ask wem?—to whom?','WEM? → DATIV',[['Ich gebe <mark>dem Kind</mark> ein Buch.','I give the child a book.','Who receives the book? Dem Kind.'],['Sie zeigt <mark>der Freundin</mark> das Foto.','She shows her friend the photo.','Who sees/receives the photo? Der Freundin.'],['Wir schicken <mark>den Eltern</mark> eine Karte.','We send the parents a card.','Who receives the card? Den Eltern.'],['Er erklärt <mark>mir</mark> die Regel.','He explains the rule to me.','Who receives the explanation? Mir.']]],
['Some verbs simply choose dative','With helfen, danken, gefallen, gehören, antworten, and folgen, learn the verb together with its dative partner.','VERB + WEM?',[['Kannst du <mark>mir</mark> helfen?','Can you help me?','helfen always takes dative.'],['Das Lied gefällt <mark>ihr</mark>.','She likes the song.','Literally: the song is pleasing to her.'],['Das Fahrrad gehört <mark>dem Mann</mark>.','The bicycle belongs to the man.','The owner appears in dative.'],['Ich danke <mark>meiner Mutter</mark>.','I thank my mother.','danken chooses dative.']]],
['Articles and pronouns carry the signal','Dative definite articles are dem, der, dem, den. Plural nouns usually gain an extra -n.','M · R · M · N → DEM · DER · DEM · DEN',[['mit <mark>dem Mann</mark>','with the man','Masculine dative: dem.'],['bei <mark>der Frau</mark>','at the woman’s place','Feminine dative: der.'],['von <mark>dem Kind</mark>','from the child','Neuter dative: dem.'],['zu <mark>den Kindern</mark>','to the children','Plural: den plus noun -n.']]],
['Word order moves; the case signal stays','A dative phrase can move for emphasis. Pronouns usually precede noun objects; with two pronouns, accusative normally comes first.','CASE MARKERS > POSITION',[['<mark>Dem Mann</mark> gebe ich das Buch.','I give the man the book.','Dem still signals the receiver at the front.'],['Ich gebe <mark>ihm</mark> das Buch.','I give him the book.','A dative pronoun precedes the noun object.'],['Ich gebe <mark>es ihm</mark>.','I give it to him.','Two pronouns: accusative es before dative ihm.'],['Kannst du <mark>mir</mark> das erklären?','Can you explain that to me?','The question keeps mir in dative.']]]],memory:'Dative rhythm: dem, der, dem, den. For plural, add -n when possible: den Kindern.',quiz:[['Ich helfe ___ Frau.',['die','der','den'],1,'helfen takes dative; feminine dative is der.'],['Wir geben ___ Kind einen Ball.',['das','dem','den'],1,'The child receives the ball: dem Kind.'],['Choose the correct plural.',['mit die Freunde','mit den Freunden','mit den Freunde'],1,'Plural dative uses den and usually adds -n to the noun.'],['Replace “dem Mann”: Ich gebe ___ das Buch.',['ihn','ihm','er'],1,'The dative pronoun for er is ihm.'],['Choose the natural two-pronoun order.',['Ich gebe ihm es.','Ich gebe es ihm.','Ich es gebe ihm.'],1,'With two pronouns, accusative normally comes first.']]},
b1:{level:'B1 · ADVANCED CASES',accent:'#d9ed72',title:'Show possession and control case across clauses.',goal:'Master genitive, relative-pronoun case, and the advanced signals that make longer German sentences precise.',snapshot:'Das ist das Auto <mark>des Mannes</mark>.',legend:'des Mannes = whose car? · genitive',sections:[
['Genitive expresses relationships and possession','Ask wessen? Masculine and neuter use des and usually add -s or -es to the noun. Feminine and plural use der.','WESSEN? → GENITIV',[['Das Ende <mark>des Films</mark> war überraschend.','The end of the film was surprising.','Whose end? Des Films.'],['Die Farbe <mark>der Wand</mark> ist schön.','The color of the wall is beautiful.','Whose color? Der Wand.'],['Die Meinung <mark>der Leute</mark> zählt.','The people’s opinion matters.','Plural genitive uses der.'],['Das Spielzeug <mark>des Kindes</mark> liegt hier.','The child’s toy is here.','Kind gains -es.']]],
['Certain prepositions prefer genitive','Formal written German commonly uses trotz, während, wegen, innerhalb, and außerhalb with genitive.','TROTZ · WÄHREND · WEGEN + GENITIV',[['<mark>Wegen des Wetters</mark> bleiben wir hier.','Because of the weather, we stay here.','wegen governs genitive.'],['<mark>Trotz der Probleme</mark> machen wir weiter.','Despite the problems, we continue.','Plural genitive uses der.'],['<mark>Während des Essens</mark> klingelte es.','During the meal, it rang.','Essen gains -s.'],['<mark>Außerhalb der Stadt</mark> ist es ruhig.','Outside the city, it is quiet.','Feminine genitive uses der.']]],
['Case belongs to the noun’s job inside its own clause','A relative pronoun copies gender and number from its noun, but its case comes from its role in the relative clause.','GENDER FROM NOUN · CASE FROM JOB',[['Der Mann, <mark>der</mark> dort steht, ist nett.','The man who stands there is nice.','The pronoun is subject: nominative.'],['Der Mann, <mark>den</mark> ich sehe, ist nett.','The man whom I see is nice.','The pronoun is direct object: accusative.'],['Der Mann, <mark>dem</mark> ich helfe, ist nett.','The man whom I help is nice.','helfen requires dative.'],['Der Mann, <mark>dessen</mark> Auto rot ist, ist nett.','The man whose car is red is nice.','Possession requires genitive.']]],
['Formal genitive and everyday alternatives coexist','Spoken German often uses von + dative for possession. Formal writing favors genitive. Names take a possessive -s without an apostrophe.','GENITIV ↔ VON + DATIV',[['Das ist das Büro <mark>des Chefs</mark>.','That is the boss’s office.','Formal written genitive.'],['Das ist das Büro <mark>von dem Chef</mark>.','That is the office of the boss.','Conversational von + dative.'],['Das ist <mark>Marias</mark> Fahrrad.','That is Maria’s bicycle.','German adds -s with no apostrophe.'],['<mark>Goethes</mark> Werke sind berühmt.','Goethe’s works are famous.','A proper name can precede the noun.']]]],memory:'Advanced case rule: gender comes from the noun; case comes from the job. Analyze each clause separately.',quiz:[['Das Auto ___ Lehrers ist neu.',['der','des','dem'],1,'Masculine genitive uses des; Lehrer gains -s.'],['Wegen ___ Regens bleiben wir zu Hause.',['der','des','dem'],1,'wegen takes genitive: des Regens.'],['Der Mann, ___ ich helfe, ist mein Nachbar.',['der','den','dem'],2,'helfen requires dative, so the relative pronoun is dem.'],['Choose the standard spelling.',['Maria’s Fahrrad','Marias Fahrrad','Marias’ Fahrrad'],1,'German adds -s to a name without an apostrophe.'],['Der Kollege, ___ Idee wir nutzen, kommt später.',['deren','dessen','dem'],1,'Masculine genitive relative pronoun is dessen.']]}}
let track=new URLSearchParams(location.search).get('level')||'a1',L=tracks[track]||tracks.a1;document.documentElement.style.setProperty('--accent',L.accent);pill.textContent=L.level.split(' · ')[0];kicker.textContent=L.level;title.textContent=L.title;goal.textContent=L.goal;snapshot.innerHTML=L.snapshot;legend.textContent=L.legend;document.title=L.title+' — Fallweise';
L.sections.forEach((s,i)=>{let ex=s[3].map(x=>`<div class="example"><div class="de">${x[0]}</div><div class="en">${x[1]}</div><div class="why">${x[2]}</div></div>`).join('');content.insertAdjacentHTML('beforeend',`<section class="section"><div class="kicker" style="color:var(--lime)">${String(i+1).padStart(2,'0')} · BUILD THE MODEL</div><h2>${s[0]}</h2><p class="intro">${s[1]}</p><div class="rule"><b>THE QUESTION</b><div class="formula">${s[2]}</div></div><div class="examples">${ex}</div></section>`)});content.insertAdjacentHTML('beforeend',`<div class="memory">✦ ${L.memory}</div>`);
if(track!=='a1'){let qi=0,locked=false,score=0;function render(){locked=false;let q=L.quiz[qi];qcount.textContent=`QUESTION ${qi+1} OF ${L.quiz.length}`;question.textContent=q[0];answers.innerHTML='';feedback.textContent='';next.style.display='none';q[1].forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>choose(i,b);answers.appendChild(b)})}function choose(i,b){if(locked)return;locked=true;let q=L.quiz[qi];answers.children[q[2]].classList.add('correct');if(i===q[2]){score++;feedback.textContent='Richtig! '+q[3]}else{b.classList.add('wrong');feedback.textContent='Not quite. '+q[3]}next.style.display='inline-block';next.textContent=qi===L.quiz.length-1?`Finish · ${score}/${L.quiz.length}`:'Next →'}next.onclick=()=>{if(qi===L.quiz.length-1){location.href='index.html';return}qi++;render()};render()}
</script><script src="immersive.js"></script><script src="speech.js?v=20260802-2"></script><script src="adaptive-cases.js?v=20260802-1"></script><script src="persistence.js?v=20260802-6"></script></body></html>
