<style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap');:root{--ink:#18201d;--cream:#f4f0e5;--paper:#fffdf6;--green:#254f3d;--lime:#d9ed72;--coral:#f1886f;--blue:#8dc8d8;--muted:#66706b;--line:#d8d4c8}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit}button{font:inherit}nav{height:70px;display:flex;align-items:center;justify-content:space-between;padding:0 25px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.logo{font:700 23px 'Fraunces';text-decoration:none}.logo i{color:var(--green)}.back{text-decoration:none;font-size:13px}.pill{background:var(--ink);color:white;border-radius:99px;padding:8px 13px;font-size:11px}.hero{max-width:1050px;margin:auto;padding:75px 24px 65px}.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;color:var(--green)}h1{font:700 clamp(54px,8vw,92px)/.9 'Fraunces';letter-spacing:-.055em;margin:14px 0 24px}.goal{font-size:19px;line-height:1.6;color:var(--muted);max-width:760px}.map{display:flex;gap:8px;flex-wrap:wrap;margin-top:25px}.map a{font-size:11px;text-decoration:none;border:1px solid var(--line);padding:7px 10px;border-radius:99px}.map a.active{background:var(--green);color:white}.body{background:var(--green);color:white;padding:75px 24px}.inner{max-width:1000px;margin:auto}.topic{margin-bottom:75px}.topic h2{font:700 clamp(36px,5vw,55px)/1 'Fraunces';letter-spacing:-.04em;margin:10px 0 18px}.intro{opacity:.78;line-height:1.65;max-width:760px}.pattern{display:grid;grid-template-columns:.65fr 1.35fr;background:var(--paper);color:var(--ink);margin:25px 0}.pattern-label{padding:25px;border-right:1px solid var(--ink);font-size:11px;letter-spacing:.12em;font-weight:700;color:var(--green)}.pattern-main{padding:25px;font:600 27px/1.4 'Fraunces'}.examples{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.example{background:var(--paper);color:var(--ink);padding:21px;min-height:135px}.de{font:600 21px/1.4 'Fraunces'}.en{font-size:12px;color:var(--muted);margin-top:9px}.use{font-size:11px;color:var(--green);font-weight:700;border-top:1px solid var(--line);margin-top:11px;padding-top:10px}.try{background:var(--accent,var(--lime));color:var(--ink);padding:19px;margin-top:20px}.try b{display:block;margin-bottom:5px}.practice{padding:75px 24px}.practice-inner{max-width:800px;margin:auto}.practice h2{font:700 52px 'Fraunces';margin:10px 0 28px}.quiz{background:var(--paper);border:1px solid var(--ink);padding:30px;box-shadow:10px 10px 0 var(--accent,var(--lime))}.qcount{font-size:10px;letter-spacing:.12em;color:var(--muted)}.question{font:600 28px/1.4 'Fraunces';margin:13px 0 22px}.answers{display:grid;gap:9px}.answer{padding:13px;background:white;border:1px solid var(--line);text-align:left;cursor:pointer}.answer.correct{background:#dcefb5}.answer.wrong{background:#f7c5ba}.feedback{min-height:30px;margin-top:14px;color:var(--green);font-size:13px;font-weight:700}.next{display:none;background:var(--ink);color:white;border:0;padding:11px 15px;cursor:pointer}.footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}@media(max-width:700px){.pattern{grid-template-columns:1fr}.pattern-label{border-right:0;border-bottom:1px solid var(--ink)}.examples{grid-template-columns:1fr}.back{font-size:0}.back:after{content:'←';font-size:18px}.body,.practice{padding:55px 18px}}</style></head>

<script>
const C=(title,intro,pattern,examples,task)=>[title,intro,pattern,examples,task],Q=(q,a,ok,why)=>[q,a,ok,why];
const modules={
'a1-sounds':{l:'A1',n:'07',t:'Hear it. Spell it. Say it.',g:'Build a reliable German sound system so unfamiliar words stop feeling unreadable.',c:'#f1886f',s:[C('The alphabet is familiar; the letter names are not','Spell names, addresses, and email confidently. The key surprises are J = jot, V = fau, W = weh, and Z = tsett.','A ah · J jot · V fau · W weh · Z tsett',[['Wie schreibt man das?','How do you spell that?','Use when requesting spelling.'],['M–A–Y–E–R','M–A–Y–E–R','Say letters individually.'],['Doppel-L','double L','Doppel means a repeated letter.'],['Meine E-Mail-Adresse ist …','My email address is …','@ is “ät”; . is “Punkt”.']],'Spell your surname aloud using German letter names.'),C('Umlauts change meaning','ä, ö, and ü are separate sounds. If unavailable, write ae, oe, and ue. ß represents a sharp “ss.”','ä ≈ eh · ö = rounded eh · ü = rounded ee · ß = ss',[['schon / schön','already / beautiful','The umlaut changes the word.'],['musste / müsste','had to / would have to','u and ü distinguish meaning.'],['Straße','street','ß follows a long vowel or diphthong.'],['Grüße','greetings','Round your lips while saying ee.']],'Alternate schon–schön slowly; keep the tongue position and round only the lips.'),C('German pronunciation follows patterns','ei sounds like eye; ie sounds like ee; eu/äu sounds like oy; z starts with ts; initial sp/st gain a sh sound.','EI → eye · IE → ee · EU → oy · Z → ts',[['mein','my','ei sounds like English “eye.”'],['Liebe','love','ie is a long ee.'],['Deutsch','German','eu sounds like “oy.”'],['Straße','street','Initial str begins “shtr.”']],'Read: Mein Freund spielt heute. Mark each sound pattern.')],q:[Q('Which spelling sounds like “eye”?',['ie','ei','eu'],1,'ei sounds like “eye.”'),Q('How can you write ü without an umlaut?',['ue','uu','uy'],0,'Use ue when ü is unavailable.'),Q('How does initial “st” sound in Straße?',['st','sht','zht'],1,'Initial st is pronounced “sht.”')]},
'a1-numbers':{l:'A1',n:'08',t:'Make plans, tell time, and pay.',g:'Use numbers in the situations that matter: prices, dates, phone numbers, appointments, and schedules.',c:'#f1886f',s:[C('German builds 21–99 backwards','Say the unit, und, then the tens: one-and-twenty.','24 = vier-und-zwanzig',[['einundzwanzig','twenty-one','eins loses its final s.'],['fünfunddreißig','thirty-five','five-and-thirty.'],['neunundneunzig','ninety-nine','nine-and-ninety.'],['zweihundertzehn','two hundred ten','Hundreds read forward.']],'Say your age, postcode, and three prices in German.'),C('Clock time has formal and everyday versions','Schedules use the 24-hour clock. Conversation commonly uses halb toward the coming hour.','14:30 = vierzehn Uhr dreißig = halb drei',[['Es ist Viertel nach acht.','It is quarter past eight.','15 minutes after.'],['Es ist halb neun.','It is 8:30.','Halfway toward nine.'],['Der Zug fährt um 16:12 Uhr.','The train leaves at 16:12.','Formal schedule time.'],['Von neun bis fünf.','From nine until five.','Use von … bis.']],'Set three imaginary appointments and say each time both ways.'),C('Dates use ordinal numbers','Spoken dates use am plus a dative ordinal ending. Written dates use dots.','am 3. Mai = am dritten Mai',[['Heute ist der erste August.','Today is August first.','The date as subject.'],['Am zehnten Juni','on June tenth','am + dative ending -en.'],['Wie viel kostet das?','How much does that cost?','Ask for a price.'],['Das kostet 12,50 Euro.','That costs €12.50.','German writes a decimal comma.']],'Say today’s date and ask the price of an imaginary ticket.')],q:[Q('What is 24?',['zwanzigvier','vierundzwanzig','vierzwanzig'],1,'German says four-and-twenty.'),Q('What time is “halb neun”?',['9:30','8:30','8:09'],1,'It is halfway toward nine.'),Q('Choose “on May third.”',['der dritte Mai','am dritten Mai','im drei Mai'],1,'Dates after am use the dative ordinal.')]},
'a1-conversations':{l:'A1',n:'09',t:'Start and survive real conversations.',g:'Introduce yourself, greet appropriately, shop politely, and use simple commands.',c:'#f1886f',s:[C('An introduction is a reusable dialogue','Prepare answers for name, origin, home, languages, and work.','ICH HEISSE · ICH KOMME AUS · ICH WOHNE IN',[['Wie heißen Sie?','What is your name?','Formal Sie.'],['Ich heiße Lina.','My name is Lina.','Also: Mein Name ist …'],['Woher kommst du?','Where are you from?','Informal du.'],['Freut mich!','Nice to meet you!','A natural closing.']],'Perform both sides of a 30-second introduction.'),C('Politeness lives in small words','bitte can mean please, here you are, or you’re welcome. Use gern to accept and leider to soften a no.','BITTE · DANKE · GERN · LEIDER',[['Ich hätte gern einen Kaffee.','I would like a coffee.','Polite ordering phrase.'],['Sonst noch etwas?','Anything else?','Common shop question.'],['Nein, danke. Das ist alles.','No, thanks. That is all.','Close the purchase.'],['Entschuldigung!','Excuse me / sorry!','Get attention or apologize.']],'Role-play ordering two items and asking the total.'),C('The imperative gives clear instructions','Use the verb stem with du, the normal ihr form, or infinitive + Sie for formal commands.','DU: KOMM! · IHR: KOMMT! · SIE: KOMMEN SIE!',[['Komm bitte rein!','Please come in!','Informal singular.'],['Wartet hier!','Wait here!','Informal plural.'],['Nehmen Sie Platz!','Take a seat!','Formal.'],['Sei vorsichtig!','Be careful!','sein is irregular.']],'Give three polite directions to a visitor.')],q:[Q('Which is formal?',['Wie heißt du?','Wie heißen Sie?','Wie heißt ihr?'],1,'Sie marks formal address.'),Q('Order politely.',['Ich will Kaffee.','Kaffee!','Ich hätte gern einen Kaffee.'],2,'hätte gern is polite and natural.'),Q('Formal command: “Wait!”',['Warte!','Warten Sie!','Wartet du!'],1,'Formal imperative uses infinitive + Sie.')]},
'a1-basics':{l:'A1',n:'10',t:'Say no—and say what belongs to whom.',g:'Master nicht, kein, possessives, and the simple connectors that hold everyday speech together.',c:'#f1886f',s:[C('kein negates nouns; nicht negates almost everything else','Use kein where an indefinite article could appear. Use nicht for verbs, adjectives, names, and definite nouns.','EIN → KEIN · ACTION/QUALITY → NICHT',[['Ich habe kein Auto.','I have no car.','Auto could use ein.'],['Das ist nicht teuer.','That is not expensive.','nicht negates an adjective.'],['Ich komme heute nicht.','I am not coming today.','nicht negates the event.'],['Ich kaufe nicht das rote Kleid.','I am not buying the red dress.','It negates a specific noun.']],'Turn three positive statements into negative ones.'),C('Possessives behave like ein-words','mein, dein, sein, ihr, unser, euer, Ihr take endings according to gender and case.','MEIN BRUDER · MEINE SCHWESTER · MEIN KIND',[['Das ist meine Mutter.','That is my mother.','Feminine adds -e.'],['Ich sehe meinen Bruder.','I see my brother.','Masculine accusative adds -en.'],['Wo ist dein Handy?','Where is your phone?','Neuter nominative has no ending.'],['Unser Haus ist klein.','Our house is small.','unser identifies the owner.']],'Describe three people or objects belonging to your family.'),C('Small connectors build longer speech','und adds, aber contrasts, oder offers a choice, and denn gives a reason without changing word order.','UND · ABER · ODER · DENN',[['Ich trinke Tee und Wasser.','I drink tea and water.','Addition.'],['Es ist klein, aber schön.','It is small but beautiful.','Contrast.'],['Kaffee oder Tee?','Coffee or tea?','Choice.'],['Ich gehe, denn ich bin müde.','I am leaving because I am tired.','Normal word order after denn.']],'Join four short statements using four different connectors.')],q:[Q('Ich habe ___ Hund.',['nicht','keinen','kein'],1,'Masculine accusative uses keinen.'),Q('Das ist ___ Schwester.',['mein','meine','meinen'],1,'Feminine nominative uses meine.'),Q('Which connector gives a reason with normal word order?',['aber','denn','oder'],1,'denn means because and keeps main-clause order.')]},
'a1-life':{l:'A1',n:'11',t:'Build an everyday-life word network.',g:'Grow useful vocabulary for routines, work, hobbies, and shopping—then practise listening and speaking strategies.',c:'#f1886f',s:[C('Learn verbs inside daily routines','Attach each verb to a time and a concrete personal sentence.','AUFSTEHEN → ARBEITEN → EINKAUFEN → SCHLAFEN',[['Ich stehe um sieben auf.','I get up at seven.','Morning routine.'],['Ich arbeite im Büro.','I work in an office.','Work context.'],['Abends koche ich.','I cook in the evening.','Time-first word order.'],['Am Wochenende wandere ich.','I hike on weekends.','Hobby context.']],'Build a six-step timeline of your real day.'),C('Shopping language follows a predictable path','Find, request, compare, ask the price, and pay.','SUCHEN → ANPROBIEREN → KOSTEN → BEZAHLEN',[['Ich suche eine Jacke.','I am looking for a jacket.','State the item.'],['Kann ich das anprobieren?','Can I try that on?','Clothes shopping.'],['Haben Sie das größer?','Do you have that larger?','Request another size.'],['Ich zahle mit Karte.','I will pay by card.','Payment phrase.']],'Role-play buyer and seller for one purchase.'),C('Listening is prediction, not translation','Before listening, predict vocabulary from the situation. Catch names, numbers, times, and stressed words first.','SITUATION → KEY WORDS → GIST → DETAIL',[['Entschuldigung, wann fährt …?','Excuse me, when does … leave?','Predict a time answer.'],['Das macht 18 Euro 40.','That comes to €18.40.','Listen for the price.'],['Noch einmal, bitte.','Once again, please.','Ask for repetition.'],['Bitte langsamer.','More slowly, please.','Control the conversation.']],'Read one dialogue aloud, cover it, then retell only the key information.')],q:[Q('How do you ask to try clothing on?',['Kann ich das anprobieren?','Was kostet an?','Ich probiere bezahlen.'],0,'anprobieren means to try on.'),Q('Best first listening goal?',['Translate every word','Catch the main situation','Write every ending'],1,'Understand the gist before details.'),Q('Ask someone to speak more slowly.',['Bitte schneller.','Bitte langsamer.','Noch lauter nicht.'],1,'Bitte langsamer is the useful request.')]},
'a2-past':{l:'A2',n:'07',t:'Tell simple past stories and give instructions.',g:'Use Präteritum forms of sein, haben, and modal verbs, then choose the right imperative for everyday advice.',c:'#8dc8d8',s:[C('sein and haben prefer simple past in speech','war and hatte are shorter and more natural than ist gewesen and hat gehabt in many conversations.','SEIN → WAR · HABEN → HATTE',[['Ich war krank.','I was ill.','Spoken and written past.'],['Wir hatten keine Zeit.','We had no time.','Past possession/state.'],['Warst du schon dort?','Had you been there?','Past question.'],['Es gab ein Problem.','There was a problem.','geben → es gab.']],'Describe yesterday using war, hatte, and es gab.'),C('Modal verbs also favor Präteritum','Use konnte, musste, wollte, durfte, sollte. The second verb remains an infinitive at the end.','KONNTE / MUSSTE + INFINITIV',[['Ich musste lange warten.','I had to wait a long time.','Past necessity.'],['Sie konnte nicht kommen.','She could not come.','Past ability.'],['Wir wollten essen gehen.','We wanted to eat out.','Past intention.'],['Durftet ihr bleiben?','Were you allowed to stay?','Past permission.']],'Explain one thing you had to, could, and wanted to do.'),C('Imperatives can give advice, directions, or warnings','Soften commands with bitte, doch, mal, or lieber.','IMPERATIV + BITTE / DOCH / MAL',[['Ruf mich bitte an.','Please call me.','Separable prefix stays at end.'],['Nimm lieber den Bus.','You’d better take the bus.','Advice.'],['Seien Sie vorsichtig.','Be careful.','Formal sein form.'],['Vergiss das nicht!','Do not forget that!','Irregular du stem.']],'Give a friend three pieces of travel advice.')],q:[Q('Yesterday I was tired.',['Ich bin müde gewesen.','Ich war müde.','Ich hatte müde.'],1,'war is the natural simple-past form.'),Q('Wir ___ lange warten.',['mussten','müssen','gemusst'],0,'Past modal: mussten + infinitive.'),Q('Formal: Be careful!',['Sei vorsichtig!','Seid vorsichtig!','Seien Sie vorsichtig!'],2,'Formal imperative of sein is Seien Sie.')]},
'a2-verb-preps':{l:'A2',n:'08',t:'Learn verbs with their preposition partners.',g:'Use fixed verb-preposition combinations and replace things naturally with wo(r)- and da(r)- compounds.',c:'#8dc8d8',s:[C('The preposition is part of the verb package','Learn warten auf, denken an, sprechen mit/über, sich interessieren für, and teilnehmen an as complete units.','VERB + PREPOSITION + CASE',[['Ich warte auf den Bus.','I am waiting for the bus.','auf + accusative.'],['Denkst du an mich?','Are you thinking of me?','an + accusative.'],['Sie spricht mit ihrem Chef.','She speaks with her boss.','mit + dative.'],['Er nimmt an dem Kurs teil.','He participates in the course.','an + dative.']],'Create one personal sentence for five verb-preposition pairs.'),C('Ask about things with wo(r)-','For objects and ideas, combine wo + preposition. Add r before a vowel: worauf, woran, worüber.','WO(R) + PREPOSITION?',[['Worauf wartest du?','What are you waiting for?','warten auf.'],['Woran denkst du?','What are you thinking about?','denken an.'],['Worüber sprecht ihr?','What are you talking about?','sprechen über.'],['Wofür interessierst du dich?','What are you interested in?','sich interessieren für.']],'Turn four statements into wo-question forms.'),C('Refer back to things with da(r)-','Use darauf, daran, darüber, dafür for things. For people, keep preposition + pronoun.','DA(R) + PREPOSITION = IT / THAT',[['Ich warte darauf.','I am waiting for it.','Thing: darauf.'],['Ich denke daran.','I am thinking about it.','Thing: daran.'],['Ich spreche mit ihm.','I speak with him.','Person: preposition + pronoun.'],['Sie freut sich darüber.','She is happy about it.','Thing: darüber.']],'Replace each repeated object with a da-compound.')],q:[Q('Complete: Ich warte ___ den Zug.',['an','auf','für'],1,'warten pairs with auf + accusative.'),Q('Ask “What are you thinking about?”',['Woran denkst du?','An was du denkst?','Wofür denkst du?'],0,'denken an becomes woran.'),Q('For a person, say “I speak with him.”',['Ich spreche damit.','Ich spreche mit ihm.','Ich spreche womit.'],1,'People use preposition + personal pronoun.')]},
'a2-questions':{l:'A2',n:'09',t:'Ask politely and place events in time.',g:'Form indirect questions and distinguish the one-time past als from repeated or conditional wenn.',c:'#8dc8d8',s:[C('Indirect questions move the verb to the end','Begin with Können Sie mir sagen …, Wissen Sie …, or Ich weiß nicht … Then use a question word and subordinate word order.','INTRO + W-WORD + … + VERB',[['Wissen Sie, wann der Zug kommt?','Do you know when the train comes?','kommt moves to the end.'],['Ich weiß nicht, wo er wohnt.','I do not know where he lives.','Embedded information question.'],['Können Sie sagen, wie viel das kostet?','Can you say how much that costs?','Polite request.'],['Sie fragt, warum wir warten.','She asks why we are waiting.','Reported question.']],'Turn three direct questions into polite indirect ones.'),C('Yes/no indirect questions use ob','When there is no question word, ob means whether/if and sends the verb to the end.','OB + SUBJECT + … + VERB',[['Ich weiß nicht, ob er kommt.','I do not know whether he is coming.','Embedded yes/no question.'],['Kannst du fragen, ob es frei ist?','Can you ask if it is available?','Polite information request.'],['Sie möchte wissen, ob wir Zeit haben.','She wants to know whether we have time.','haben at the end.'],['Obwohl is different.','Although is different.','Do not confuse ob and obwohl.']],'Embed three yes/no questions using ob.'),C('als is one past moment; wenn repeats or sets a condition','Use als for a single period/event in the past. Use wenn for repeated past, present/future conditions, and “whenever.”','ALS = ONCE IN PAST · WENN = REPEAT/CONDITION',[['Als ich klein war, …','When I was little, …','One past life period.'],['Wenn ich Zeit habe, …','When/if I have time, …','Present condition.'],['Immer wenn es regnete, …','Whenever it rained, …','Repeated past event.'],['Wenn du kommst, ruf an.','If you come, call.','Future condition.']],'Write one childhood als sentence and one future wenn sentence.')],q:[Q('Do you know when he comes?',['Wissen Sie, wann kommt er?','Wissen Sie, wann er kommt?','Wissen Sie, er wann kommt?'],1,'Indirect-question verb comes last.'),Q('I do not know whether it is open.',['Ich weiß nicht, wenn es offen ist.','Ich weiß nicht, ob es offen ist.','Ich weiß nicht, als es offen ist.'],1,'Yes/no indirect questions use ob.'),Q('___ ich zehn war, zog ich um.',['Wenn','Als','Ob'],1,'A single past time uses als.')]},
'a2-adjectives':{l:'A2',n:'10',t:'Make adjective endings predictable.',g:'Move beyond shortcuts and choose endings after definite, indefinite, and zero articles.',c:'#8dc8d8',s:[C('After der-words, adjectives mostly relax','The article clearly marks gender and case. Use -e in basic nominative singular and feminine/neuter accusative; use -en elsewhere.','DER GUTE · DEN GUTEN · DEM GUTEN',[['der rote Mantel','the red coat','Masculine nominative: -e.'],['den roten Mantel','the red coat','Masculine accusative: -en.'],['mit dem roten Mantel','with the red coat','Dative: -en.'],['die roten Mäntel','the red coats','Plural: -en.']],'Change one noun phrase through nominative, accusative, and dative.'),C('After ein-words, the adjective supplies missing signals','Where ein has no ending, the adjective displays gender: -er masculine, -es neuter.','EIN GUTER · EIN GUTES · EINE GUTE',[['ein neuer Job','a new job','Adjective marks masculine.'],['ein kleines Kind','a small child','Adjective marks neuter.'],['eine nette Kollegin','a nice colleague','Feminine -e.'],['keinen freien Platz','no free seat','Masculine accusative -en.']],'Describe four objects using ein/kein plus an adjective.'),C('Without an article, the adjective does the full job','Strong adjective endings resemble der-word endings and carry gender/case information themselves.','GUTER WEIN · FRISCHES BROT · MIT KALTER MILCH',[['frischer Kaffee','fresh coffee','Masculine nominative -er.'],['kaltes Wasser','cold water','Neuter nominative -es.'],['rote Äpfel','red apples','Plural nominative -e.'],['mit gutem Käse','with good cheese','Masculine dative -em.']],'Build a shopping list with six article-free adjective phrases.')],q:[Q('Choose: der ___ Hund.',['kleiner','kleine','kleinen'],1,'After der in masculine nominative, use -e.'),Q('Choose: ein ___ Buch.',['interessante','interessantes','interessanten'],1,'The adjective supplies neuter -es.'),Q('Choose: mit ___ Wasser.',['kaltes','kaltem','kalten'],1,'Without an article, neuter dative uses -em.')]},
'a2-life':{l:'A2',n:'11',t:'Handle health, study, work, and social life.',g:'Build thematic vocabulary and practise longer dialogues, short reading, and useful everyday writing.',c:'#8dc8d8',s:[C('Health conversations follow symptom → duration → advice','Name the body part or symptom, say how long, then understand an instruction.','SYMPTOM + SEIT + TIME',[['Ich habe Kopfschmerzen.','I have a headache.','Common symptom pattern.'],['Seit gestern fühle ich mich schlecht.','I have felt unwell since yesterday.','seit + present tense.'],['Nehmen Sie diese Tabletten.','Take these tablets.','Medical imperative.'],['Ich brauche einen Termin.','I need an appointment.','Reception phrase.'],['Mein Hals tut weh.','My throat hurts.','Body part + tut weh.'],['Ich habe seit drei Tagen Fieber.','I have had a fever for three days.','seit + duration uses the present tense.'],['Sie sollten viel Wasser trinken.','You should drink plenty of water.','sollten gives gentle medical advice.'],['Wie oft soll ich das Medikament nehmen?','How often should I take the medicine?','Ask about dosage frequency.']],'Role-play making a doctor’s appointment and describing two symptoms.'),C('Study and work require functional phrases','Ask for clarification, describe duties, arrange a meeting, and report absence.','KLÄREN · PLANEN · INFORMIEREN',[['Könnten Sie das erklären?','Could you explain that?','Request clarification.'],['Ich bin für Kunden zuständig.','I am responsible for customers.','Describe duties.'],['Passt Ihnen Dienstag?','Does Tuesday suit you?','Arrange a meeting.'],['Ich kann heute leider nicht kommen.','Unfortunately I cannot come today.','Report absence.'],['Was genau soll ich machen?','What exactly should I do?','Clarify a task.'],['Wann müssen wir das abgeben?','When do we have to hand that in?','Ask about a deadline.'],['Ich kümmere mich um die Präsentation.','I will take care of the presentation.','Take responsibility for a task.'],['Können wir den Termin auf Donnerstag verschieben?','Can we move the appointment to Thursday?','Suggest a new meeting date.']],'Write a three-sentence message rescheduling a meeting.'),C('Read and write for purpose','First identify text type and goal. Then scan for who, when, where, and required action.','TEXT TYPE → PURPOSE → KEY DETAILS',[['Betreff: Terminänderung','Subject: Change of appointment','Email purpose.'],['Leider muss ich …','Unfortunately I have to …','Explain the problem.'],['Könnten wir stattdessen …?','Could we instead …?','Suggest a solution.'],['Vielen Dank für Ihr Verständnis.','Thank you for your understanding.','Polite closing.'],['Ich schreibe Ihnen wegen unseres Termins.','I am writing to you about our appointment.','State the reason for writing.'],['Der Kurs beginnt am 12. Mai um 18 Uhr.','The course begins on 12 May at 6 p.m.','Scan a notice for date and time.'],['Bitte melden Sie sich bis Freitag an.','Please register by Friday.','Identify the required action and deadline.'],['Ich freue mich auf Ihre Antwort.','I look forward to your reply.','Appropriate formal closing sentence.']],'Write a 50-word message changing an appointment and proposing another time.')],q:[Q('How do you say “since yesterday”?',['für gestern','seit gestern','vor gestern'],1,'seit marks an action/state continuing until now.'),Q('Ask to reschedule politely.',['Termin ändern!','Könnten wir einen neuen Termin vereinbaren?','Ich will andere Zeit.'],1,'Könnten wir …? is polite and complete.'),Q('First reading step?',['Translate everything','Identify text type and purpose','Look up every noun'],1,'Purpose guides what details matter.')]},
'b1-clauses':{l:'B1',n:'07',t:'Build precise relative and infinitive clauses.',g:'Use every common relative-pronoun case and distinguish zu-infinitive clauses from dass-clauses.',c:'#d9ed72',s:[C('Relative-pronoun case comes from its clause role','Gender/number comes from the referenced noun; case comes from the verb or preposition inside the relative clause.','NOUN GENDER + CLAUSE JOB',[['Die Frau, die dort steht, …','The woman who stands there …','Nominative subject.'],['Die Frau, der ich helfe, …','The woman whom I help …','Dative after helfen.'],['Die Frau, mit der ich arbeite, …','The woman with whom I work …','Preposition determines dative.'],['Die Frau, deren Auto …','The woman whose car …','Genitive possession.']],'Take one person and describe them with four relative clauses.'),C('zu-infinitives work when the subject is shared or general','Use them after versuchen, planen, hoffen, vergessen, and adjective/noun expressions. No explicit subject appears.','…, ZU + INFINITIVE',[['Ich versuche, früher zu schlafen.','I try to sleep earlier.','Same subject: ich.'],['Er plant, umzuziehen.','He plans to move.','zu enters separable verb: umzuziehen.'],['Es ist wichtig, zuzuhören.','It is important to listen.','General subject.'],['Ich habe Lust, auszugehen.','I feel like going out.','Noun expression + zu.']],'Combine six sentence pairs using zu-infinitives.'),C('Use dass when the subjects differ','If the embedded action has its own explicit subject, a dass-clause is usually required. Modal verbs and certain perception verbs omit zu.','SAME SUBJECT → ZU · DIFFERENT SUBJECT → DASS',[['Ich hoffe, bald zu reisen.','I hope to travel soon.','Same subject.'],['Ich hoffe, dass du kommst.','I hope that you come.','Different subject: du.'],['Ich kann schwimmen.','I can swim.','No zu after modal.'],['Ich sehe ihn gehen.','I see him leave.','No zu after sehen.']],'Decide zu or dass for eight sentence pairs.')],q:[Q('Die Frau, ___ ich helfe, ist nett.',['die','der','deren'],1,'helfen requires dative: der.'),Q('Er plant, morgen ___.',['abzufahren','zu abfahren','dass abfährt'],0,'zu goes inside separable abfahren.'),Q('I hope that you come.',['Ich hoffe, zu kommen.','Ich hoffe, dass du kommst.','Ich hoffe, du zu kommen.'],1,'Different subjects require dass.')]},
'b1-precision':{l:'B1',n:'08',t:'Control difficult noun and adjective forms.',g:'Master N-declension and advanced adjective endings across cases and article types.',c:'#d9ed72',s:[C('Weak masculine nouns gain -n or -en','Most nouns for male people ending in -e and several international nouns change in every case except nominative singular.','DER STUDENT → DEN/DEM/DES STUDENTEN',[['Der Student lernt.','The student studies.','Nominative stays unchanged.'],['Ich sehe den Studenten.','I see the student.','Accusative adds -en.'],['Ich helfe dem Kollegen.','I help the colleague.','Kollege adds -n.'],['Die Meinung des Experten','The expert’s opinion','Genitive adds -en.']],'Decline Kunde, Junge, and Präsident through four cases.'),C('Adjective endings respond to the determiner','Weak after clear der-signals, mixed after ein-signals, strong without a determiner.','CLEAR SIGNAL → WEAK · MISSING SIGNAL → ADJECTIVE',[['mit diesem neuen Gerät','with this new device','Dative after dieser-word: -en.'],['trotz eines großen Problems','despite a big problem','Genitive mixed: -en.'],['wegen starker Regenfälle','because of heavy rainfall','No article, plural genitive -er.'],['mehrere interessante Ideen','several interesting ideas','mehrere takes strong-style -e here.']],'Label the article signal before choosing each adjective ending.'),C('Parallel structures make editing easier','When several adjectives modify one noun, they take the same ending. Participles can act as adjectives too.','ENDINGS AGREE WITH THE SAME NOUN',[['ein langer, schwieriger Tag','a long, difficult day','Both masculine nominative -er.'],['die gestern gelieferte Ware','the goods delivered yesterday','Past participle as adjective.'],['ein gut funktionierendes System','a well-functioning system','Present participle + neuter -es.'],['mit erfahrenen deutschen Kollegen','with experienced German colleagues','Both plural dative -en.']],'Expand four nouns with two coordinated adjectives.')],q:[Q('Ich spreche mit dem ___.',['Kollege','Kollegen','Kolleges'],1,'Kollege is an N-declension noun.'),Q('trotz eines ___ Problems',['großes','großen','großer'],1,'Genitive after eines uses adjective -en.'),Q('ein gut ___ System',['funktionierende','funktionierendes','funktionierenden'],1,'Neuter nominative after ein requires -es.')]},
'b1-prep-system':{l:'B1',n:'09',t:'Master fixed prepositions as a system.',g:'Use verbs, nouns, and adjectives with fixed prepositions plus fluent pronominal adverbs.',c:'#d9ed72',s:[C('Different word classes can demand a preposition','Learn the full lexical package and its case, not the isolated word.','WORD + PREPOSITION + CASE',[['abhängen von + D','depend on','Verb package.'],['Interesse an + D','interest in','Noun package.'],['stolz auf + A','proud of','Adjective package.'],['verantwortlich für + A','responsible for','Adjective package.']],'Create a spaced-repetition list grouped by preposition and case.'),C('Pronominal adverbs connect whole arguments','Use damit, davon, daran, darüber, dafür to avoid repetition and refer to things or clauses.','DA(R)-WORD = PREPOSITIONAL REFERENCE',[['Davon hängt alles ab.','Everything depends on that.','abhängen von → davon.'],['Ich rechne damit, dass …','I expect that …','damit previews a dass-clause.'],['Sie ist stolz darauf, …','She is proud to …','darauf previews a zu-clause.'],['Wir sprechen darüber.','We talk about it.','über → darüber.']],'Replace six repeated prepositional objects with da-words.'),C('Question and answer should mirror each other','Build pairs: woran? daran; wovon? davon; worauf? darauf. People remain preposition + wen/wem.','WO(R)-? ↔ DA(R)-',[['Wovon hängt das ab? – Davon.','What does that depend on? – On that.','von pair.'],['Worauf bist du stolz? – Darauf.','What are you proud of? – Of that.','auf pair.'],['Auf wen wartest du? – Auf Mia.','Whom are you waiting for?','Person: no worauf.'],['Mit wem sprichst du? – Mit Ali.','With whom are you speaking?','Person: wem.']],'Generate question-answer pairs for ten fixed-preposition expressions.')],q:[Q('Complete: Das hängt ___ Wetter ab.',['auf dem','vom','für das'],1,'abhängen von + dative: vom Wetter.'),Q('What are you proud of?',['Worauf bist du stolz?','Wovon bist du stolz?','Auf wem bist du stolz?'],0,'stolz auf becomes worauf for things.'),Q('I expect it.',['Ich rechne davon.','Ich rechne damit.','Ich rechne darauf.'],1,'rechnen mit becomes damit.')]},
'b1-passive-links':{l:'B1',n:'10',t:'Report processes and connect complex ideas.',g:'Use passive across time and with modal verbs, then organize nuanced relationships with advanced connectors.',c:'#d9ed72',s:[C('Passive changes tense through werden','Keep the participle and change werden: wird, wurde, ist … worden.','PRESENT: WIRD GEMACHT · PAST: WURDE GEMACHT',[['Die Brücke wird gebaut.','The bridge is being built.','Present process.'],['Die Brücke wurde gebaut.','The bridge was built.','Präteritum passive.'],['Die Brücke ist gebaut worden.','The bridge has been built.','Perfekt uses worden.'],['Die Brücke war gebaut worden.','The bridge had been built.','Plusquamperfekt passive.']],'Transform one active sentence through four passive tenses.'),C('Modal passive creates a three-part frame','Conjugate the modal; place past participle + werden at the end.','MODAL + … + PARTIZIP II + WERDEN',[['Das muss repariert werden.','That must be repaired.','Necessity.'],['Die Regeln sollten erklärt werden.','The rules should be explained.','Recommendation.'],['Kann das geändert werden?','Can that be changed?','Possibility question.'],['Es darf nicht geöffnet werden.','It may not be opened.','Prohibition.']],'Rewrite four instructions as impersonal modal-passive rules.'),C('Advanced connectors clarify logic','während contrasts/synchronizes, falls gives a possible condition, sobald marks immediate sequence, indem explains method.','WÄHREND · FALLS · SOBALD · INDEM',[['Während er spart, gibt sie viel aus.','While he saves, she spends a lot.','Contrast.'],['Falls es regnet, bleiben wir.','In case it rains, we stay.','Possible condition.'],['Sobald ich ankomme, rufe ich an.','As soon as I arrive, I call.','Immediate sequence.'],['Man lernt, indem man übt.','One learns by practising.','Method.']],'Join eight pairs using the connector that matches the logic.')],q:[Q('The email was sent.',['Die E-Mail wird geschickt.','Die E-Mail wurde geschickt.','Die E-Mail ist schicken.'],1,'Präteritum passive uses wurde + participle.'),Q('It must be repaired.',['Es muss reparieren.','Es wird müssen repariert.','Es muss repariert werden.'],2,'Modal + participle + werden.'),Q('Which connector means “by doing”?',['falls','indem','sobald'],1,'indem introduces the method.')]},
'b1-exam':{l:'B1',n:'11',t:'Use German independently—and prove it.',g:'Build thematic vocabulary, tell coherent stories, write formal emails, present opinions, and practise B1 task strategies.',c:'#d9ed72',s:[C('Organize vocabulary into argument-ready networks','For work, media, society, environment, and relationships, collect nouns, verbs, adjectives, and collocations together.','THEME → COLLOCATIONS → POSITION',[['eine Entscheidung treffen','make a decision','Work collocation.'],['Nachrichten verfolgen','follow the news','Media collocation.'],['Verantwortung übernehmen','take responsibility','Society/work.'],['Energie sparen','save energy','Environment.']],'Build a 12-word network for one theme and use six items in a spoken opinion.'),C('Longer production needs a visible spine','Stories use setting → event → reaction → result. Opinions use position → reason → example → contrast → conclusion.','STRUCTURE BEFORE SENTENCES',[['Zuerst möchte ich …','First I would like to …','Presentation opening.'],['Ein Beispiel dafür ist …','An example of this is …','Support.'],['Einerseits …, andererseits …','On one hand …, on the other …','Balanced argument.'],['Abschließend lässt sich sagen …','In conclusion, one can say …','Formal conclusion.']],'Give a two-minute talk using all four structural moves.'),C('B1 tests communication, not perfection','Read tasks before texts, listen for purpose and attitude, answer every writing point, and keep speaking with repair phrases.','TASK → PLAN → PRODUCE → CHECK',[['Wenn ich Sie richtig verstanden habe, …','If I understood you correctly …','Speaking repair.'],['Dazu möchte ich ergänzen, dass …','I would add that …','Discussion turn.'],['Ich schreibe Ihnen, weil …','I am writing because …','Formal email purpose.'],['Könnten Sie mir bitte mitteilen, …?','Could you please tell me …?','Formal request.']],'Simulate a four-part exam: scan a notice, take listening notes, write 80 words, speak for two minutes.')],q:[Q('Which is a natural collocation?',['eine Entscheidung machen','eine Entscheidung treffen','eine Entscheidung tun'],1,'German uses eine Entscheidung treffen.'),Q('Best opinion structure?',['Example only','Position → reason → example → conclusion','Translate freely'],1,'A visible structure makes B1 production coherent.'),Q('A useful repair phrase is:',['Keine Ahnung.','Wenn ich Sie richtig verstanden habe …','Ich kann nicht Deutsch.'],1,'It keeps communication moving and checks understanding.')]}}
const groups={A1:['a1-sounds','a1-numbers','a1-conversations','a1-basics','a1-life'],A2:['a2-past','a2-verb-preps','a2-questions','a2-adjectives','a2-life'],B1:['b1-clauses','b1-precision','b1-prep-system','b1-passive-links','b1-exam']};let id=new URLSearchParams(location.search).get('id')||'a1-sounds',M=modules[id]||modules['a1-sounds'];document.documentElement.style.setProperty('--accent',M.c);pill.textContent=M.l;kicker.textContent=`${M.l} · CHAPTER ${M.n}`;title.textContent=M.t;goal.textContent=M.g;document.title=M.t+' — Fallweise';groups[M.l].forEach(x=>{let a=document.createElement('a');a.href=`skills.html?id=${x}`;a.textContent=modules[x].t;a.className=x===id?'active':'';map.appendChild(a)});M.s.forEach((s,i)=>{let ex=s[3].map(e=>`<div class="example"><div class="de">${e[0]}</div><div class="en">${e[1]}</div><div class="use">${e[2]}</div></div>`).join('');topics.insertAdjacentHTML('beforeend',`<article class="topic"><div class="kicker" style="color:var(--lime)">${String(i+1).padStart(2,'0')} · LEARN & USE</div><h2>${s[0]}</h2><p class="intro">${s[1]}</p><div class="pattern"><div class="pattern-label">PATTERN</div><div class="pattern-main">${s[2]}</div></div><div class="examples">${ex}</div><div class="try"><b>Try it</b>${s[4]}</div></article>`)});let qi=0,score=0,locked=false;function render(){locked=false;let q=M.q[qi];qcount.textContent=`QUESTION ${qi+1} OF ${M.q.length}`;question.textContent=q[0];answers.innerHTML='';feedback.textContent='';next.style.display='none';q[1].forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=a;b.onclick=()=>choose(i,b);answers.appendChild(b)})}function choose(i,b){if(locked)return;locked=true;let q=M.q[qi];answers.children[q[2]].classList.add('correct');if(i===q[2]){score++;feedback.textContent='Richtig! '+q[3]}else{b.classList.add('wrong');feedback.textContent='Not quite. '+q[3]}next.style.display='inline-block';next.textContent=qi===M.q.length-1?`Finish · ${score}/${M.q.length}`:'Next →'}next.onclick=()=>{if(qi===M.q.length-1){location.href='index.html';return}qi++;render()};render();
</script><script src="immersive.js"></script><script src="speech.js?v=20260802-2"></script><script src="persistence.js?v=20260802-4"></script></body></html>
